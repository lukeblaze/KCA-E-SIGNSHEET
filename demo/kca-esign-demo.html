<title>KCA e-Sign Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: KCA portal look. Navy header band with a gold rule, white work cards on a pale field, one gold primary action per screen. */
:root{--navy:#0B2A5B;--gold:#F2A900;--head:#0B2A5B;--bg:#F3F5F9;--card:#FFFFFF;--ink:#1B2433;--mute:#3A4558;--line:#D5DBE6;--edge:#9AA5B8;--ro:#EEF1F6;--hover:#EEF3FB;--info:#EAF1FB;--toast:#0B2A5B;
--ok-bg:#E6F4EA;--ok:#14532D;--wn-bg:#FFF4D6;--wn:#5C3D00;--er-bg:#FDE8E8;--er:#8A1C1C;--font:"Open Sans",Arial,Helvetica,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--head:#A9C4F2;--bg:#0E141F;--card:#172033;--ink:#E7ECF5;--mute:#A6B2C6;--line:#2B3850;--edge:#5B6B87;--ro:#1F2A40;--hover:#1D2A44;--info:#1A2B4A;--toast:#24365A;--ok-bg:#12331F;--ok:#8FDDA8;--wn-bg:#3A2F10;--wn:#F5D58A;--er-bg:#3D1A1C;--er:#F5A3A6;color-scheme:dark}}
:root[data-theme="dark"]{--head:#A9C4F2;--bg:#0E141F;--card:#172033;--ink:#E7ECF5;--mute:#A6B2C6;--line:#2B3850;--edge:#5B6B87;--ro:#1F2A40;--hover:#1D2A44;--info:#1A2B4A;--toast:#24365A;--ok-bg:#12331F;--ok:#8FDDA8;--wn-bg:#3A2F10;--wn:#F5D58A;--er-bg:#3D1A1C;--er:#F5A3A6;color-scheme:dark}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
body{font-family:var(--font)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);min-width:0;font-family:"Open Sans",Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit}
.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1100px;margin:0 auto;padding-block:10px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.logo{width:38px;height:38px;border-radius:4px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{color:#D9E2F2;text-decoration:none;padding:8px 14px;border-radius:4px;font-weight:600;font-size:14px}
nav a:hover{background:rgba(255,255,255,.12)}
nav a[aria-current=page]{background:var(--card);color:var(--head)}
.who{font-size:13px;display:flex;align-items:center;gap:12px}
.who button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:6px 12px;cursor:pointer;min-height:36px}
main{max-width:1100px;margin:0 auto;padding-block:24px 64px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;color:var(--head);margin:0 0 4px}
h2{font-size:16px;color:var(--head);margin:0 0 12px}
.sub{color:var(--mute);font-size:13px;margin:0 0 20px}
.card{background:var(--card);border-radius:6px;box-shadow:0 1px 3px rgba(11,42,91,.15);padding:20px;margin-bottom:16px}
.card.gold{border-left:4px solid var(--gold)}
.card.red{border-left:4px solid var(--er)}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid,.cols{grid-template-columns:1fr}.top-in{gap:10px}}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],input[type=datetime-local],select,textarea{width:100%;min-height:46px;border:1px solid var(--edge);border-radius:4px;padding:8px 12px;background:var(--card);color:var(--ink)}
input[readonly]{background:var(--ro);color:var(--mute)}
textarea{min-height:80px}
:focus-visible{outline:3px solid #2B6CD9;outline-offset:2px}
.field{margin-bottom:14px}
.btn{min-height:46px;padding:0 20px;border-radius:4px;border:1px solid var(--head);background:var(--card);color:var(--head);font-weight:700;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:#E09E00}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.danger{border-color:var(--er);color:var(--er)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row.pick{color:var(--ink);cursor:pointer;border:1px solid var(--line);border-radius:4px;margin-bottom:8px;background:var(--card);width:100%;text-align:left}
.row.pick:hover{border-color:var(--head);background:var(--hover)}
.m{font-size:13px;color:var(--mute)}
.k{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.k.ok{background:var(--ok-bg);color:var(--ok)}.k.wn{background:var(--wn-bg);color:var(--wn)}.k.er{background:var(--er-bg);color:var(--er)}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.checks{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.checks li{display:flex;gap:8px;align-items:flex-start;margin:3px 0}
.checks .dot{flex:none;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-top:2px}
.dot.p{background:var(--ok)}.dot.f{background:var(--er)}
.sigwrap{border:2px dashed var(--edge);border-radius:4px;background:var(--card);position:relative}
.sigwrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigwrap .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);pointer-events:none;font-size:14px}
.big{font-size:34px;font-weight:700;color:var(--head);line-height:1.1}
.center{max-width:430px;margin:48px auto}
.err{border:1px solid var(--er);background:var(--er-bg);color:var(--er);border-radius:4px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.inf{background:var(--info);color:var(--head);border-radius:4px;padding:10px 12px;font-size:13px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--toast);color:#fff;padding:14px 20px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;transition:transform .25s;z-index:20;border-left:5px solid var(--gold)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.bad{border-left-color:#E5484D}
.back{background:none;border:0;color:var(--head);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:8px;min-height:36px}
.sr{position:absolute;left:-9999px}


[hidden]{display:none !important}
.kiosk{font-size:12px;color:#D9E2F2;opacity:.85;margin-left:auto}
.who-card{display:flex;gap:16px;align-items:center}
.mug{width:84px;height:104px;object-fit:cover;border-radius:6px;border:2px solid var(--gold);flex:none;background:var(--ro)}
.opt{display:flex;gap:8px;align-items:center;padding:10px 0;font-weight:600;min-height:44px}
.opt input{width:22px;height:22px;flex:none}
.tl{border-left:3px solid var(--gold);padding:2px 0 2px 10px;margin:8px 0}
.card.inc{border-left:4px solid var(--er)}
.sigprev{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px;margin:6px 0;height:90px;display:flex;align-items:center;justify-content:center;color:#5A6577}
.sigprev img{max-height:78px;max-width:100%}
.fp{background:var(--ro);border-radius:4px;padding:8px 10px;margin-top:8px}
.keyuse{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.paper .tag{font-size:10px;color:#5A6577;font-weight:600}.paper .tag.red{color:#8A1C1C}
.paper .sec{border-top:1px solid #D5DBE6;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.paper .ab{font-size:11px}.paper .inc{border-left:3px solid #8A1C1C;padding-left:8px;margin-top:6px}
.auth{display:flex;gap:16px;align-items:center;justify-content:space-between;border-top:1px dashed #0B2A5B;padding-top:10px;flex-wrap:wrap}
.authsig,.authpat{display:flex;flex-direction:column;gap:4px}.dirsig{height:46px;width:auto;max-width:180px}
#demobar{background:#FFE9A8;color:#3A2A00;font-size:13px}
#demobar .dbin{max-width:1100px;margin:0 auto;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
#demobar b{background:#3A2A00;color:#FFE9A8;border-radius:3px;padding:1px 7px;letter-spacing:.08em;font-size:12px}
.dq{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dbtn{border:1px solid #3A2A00;background:transparent;color:#3A2A00;border-radius:4px;padding:4px 10px;min-height:32px;cursor:pointer;font-weight:600}
.dbtn:hover{background:#FFF4D6}
.dmsg{flex-basis:100%;font-weight:600}
.ov{position:fixed;inset:0;background:rgba(8,16,34,.66);z-index:50;overflow:auto;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
.ovbox{background:var(--bg);color:var(--ink);max-width:860px;margin:0 auto;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ovbox.sm{max-width:440px;margin-top:20vh}
.ovbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.note{font-size:13px;color:var(--mute);margin:0}
.mail{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mail small{display:inline-block;width:56px;color:var(--mute);font-weight:700}
.mail pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:8px 0;padding:10px 0;border-block:1px solid var(--line)}
.att{display:inline-block;background:var(--info);color:var(--head);border-radius:4px;padding:5px 10px;font-weight:600;word-break:break-all}
.paper{background:#fff;color:#1B2433;border:1px solid #D5DBE6;font-size:12px;min-width:0}
.phead{background:#0B2A5B;color:#fff;border-bottom:4px solid #F2A900;padding:14px 18px;display:flex;gap:12px;align-items:center}
.phead>div:nth-child(2){flex:1}.phead div div{font-size:11px;color:#D9E2F2}
.plogo{background:#F2A900;color:#0B2A5B;font-weight:700;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.pr{font-size:12px}.pbody{padding:18px;display:flex;flex-direction:column;gap:12px}
.paper h3{margin:0;font-size:18px;color:#0B2A5B}.pm{margin:0;color:#5A6577}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px}
.paper small{display:block;font-size:10px;font-weight:700;color:#5A6577;letter-spacing:.05em}
.pbox{border:1px solid #D5DBE6;height:110px;display:flex;align-items:center;justify-content:center;padding:6px}
.pbox .psig{max-height:98px}
.tw{overflow-x:auto}.paper table{border-collapse:collapse;width:100%;min-width:560px}
.paper th{background:#0B2A5B;color:#fff;text-align:left;font-size:10px;padding:6px}
.paper td{border-bottom:1px solid #D5DBE6;padding:4px 6px;font-size:11px;vertical-align:middle}
.paper td .psig{height:34px;width:auto;max-width:120px;display:block}
.seal{background:#F3F5F9;border:1px solid #0B2A5B;border-left:5px solid #F2A900;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seal .code{font-size:16px;font-weight:700;word-break:break-all}.sealg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all}
.sheet-note{margin:0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* ==== UI/UX overhaul: KCA navy + gold, glass cards, restrained motion ====
   Principles (from the design skills reviewed): colour on data not chrome; transform/opacity-only motion under 300ms with
   strong ease-out; no motion on things used constantly (typing, search results); hover effects only on pointer devices;
   everything calm under prefers-reduced-motion. */
:root{
  --ease-out:cubic-bezier(.23,1,.32,1);
  --r:16px;--r-sm:10px;
  --glass:rgba(255,255,255,.78);--glass-line:rgba(255,255,255,.9);--glass-edge:rgba(11,42,91,.10);
  --sh1:0 1px 2px rgba(11,42,91,.08),0 8px 24px -8px rgba(11,42,91,.18);
  --sh2:0 2px 4px rgba(11,42,91,.10),0 18px 40px -12px rgba(11,42,91,.30);
  --field:#fff;--field-line:#B7C1D3;--tile:rgba(255,255,255,.6);--aurora1:rgba(11,42,91,.16);--aurora2:rgba(242,169,0,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(23,32,51,.72);--glass-line:rgba(255,255,255,.08);--glass-edge:rgba(0,0,0,.4);--sh1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.5),0 22px 44px -14px rgba(0,0,0,.7);--field:#101828;--field-line:#3B4A66;--tile:rgba(255,255,255,.04);--aurora1:rgba(70,110,200,.22);--aurora2:rgba(242,169,0,.10)}}
:root[data-theme="dark"]{--glass:rgba(23,32,51,.72);--glass-line:rgba(255,255,255,.08);--glass-edge:rgba(0,0,0,.4);--sh1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.5),0 22px 44px -14px rgba(0,0,0,.7);--field:#101828;--field-line:#3B4A66;--tile:rgba(255,255,255,.04);--aurora1:rgba(70,110,200,.22);--aurora2:rgba(242,169,0,.10)}

/* backdrop: two soft light pools, drifting very slowly (transform only, compositor-run) */
body{background:var(--bg);position:relative;overflow-x:hidden}
body::after{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 12% 8%,var(--aurora1),transparent 70%),radial-gradient(34vmax 34vmax at 88% 18%,var(--aurora2),transparent 70%),radial-gradient(44vmax 44vmax at 70% 100%,var(--aurora1),transparent 70%);
  animation:drift 48s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate3d(2vmax,1.5vmax,0) scale(1.04)}}

/* header: frosted navy bar with a gold hairline */
.top{background:linear-gradient(180deg,#0E3573,#0B2A5B);border-bottom:0;box-shadow:0 6px 24px -10px rgba(7,24,56,.55);backdrop-filter:blur(10px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold) 18%,#FFD36B 50%,var(--gold) 82%,transparent)}
.brand{font-size:16px;letter-spacing:.01em;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;font-size:12px;letter-spacing:.06em;color:#fff;
  background:radial-gradient(120% 120% at 20% 10%,#2A5BB0,#0B2A5B 70%);box-shadow:inset 0 0 0 2px var(--gold),0 4px 12px rgba(0,0,0,.35)}
nav{gap:6px}
nav a{border-radius:999px;padding:8px 16px;color:#CFDAEE;transition:background-color .15s ease,color .15s ease}
nav a[aria-current=page]{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
nav a[aria-current=page]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle}
.who button{border-radius:999px;border-color:rgba(255,255,255,.35)}
@media (hover:hover){nav a:hover{background:rgba(255,255,255,.1)}.who button:hover{background:rgba(255,255,255,.12)}}

/* page rhythm */
main{max-width:1120px;padding-block:32px 72px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.01em;margin-bottom:6px}
h1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--gold);margin-top:10px}
.who-card h1::after{display:none}
h2{font-size:17px}h3{font-size:14px;color:var(--head);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.sub{margin-bottom:24px;font-size:14px;max-width:70ch}
.grid{gap:24px}.cols{gap:18px}

/* glass cards with a raised, layered edge */
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:24px;margin-bottom:18px;
  box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.55);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);position:relative}
@supports not (backdrop-filter:blur(1px)){.card{background:var(--card)}}
.card.gold{border-left:1px solid var(--glass-line);background:linear-gradient(135deg,rgba(242,169,0,.14),var(--glass) 55%)}
.card.gold::before,.card.red::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.card.red{border-left:1px solid var(--glass-line);background:linear-gradient(135deg,var(--er-bg),var(--glass) 60%)}
.card.red::before{background:var(--er)}
.card .card{box-shadow:none;background:var(--tile);backdrop-filter:none}
.big{font-size:44px;letter-spacing:-.02em;background:linear-gradient(135deg,var(--head),#2A5BB0);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme:dark){.big{background:linear-gradient(135deg,#E7ECF5,#8FB0EA);-webkit-background-clip:text;background-clip:text}}

/* controls */
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],input[type=datetime-local],select,textarea{border-radius:var(--r-sm);background:var(--field);border:1px solid var(--field-line);min-height:48px;transition:border-color .15s ease,box-shadow .15s ease}
input[readonly]{background:var(--ro);border-style:dashed}
input:focus,select:focus,textarea:focus{outline:0;border-color:#2B6CD9;box-shadow:0 0 0 4px rgba(43,108,217,.22)}
:focus-visible{outline:3px solid #2B6CD9;outline-offset:2px;border-radius:8px}
label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.btn{border-radius:12px;min-height:48px;font-weight:700;background:var(--card);border:1px solid var(--field-line);color:var(--head);box-shadow:0 1px 2px rgba(11,42,91,.08);transition:transform .14s var(--ease-out),box-shadow .14s ease,background-color .14s ease}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:38px;border-radius:10px}
.btn.gold{background:linear-gradient(180deg,#FFC21F,#F2A900);border-color:#D99600;color:#0B2A5B;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 6px 14px -6px rgba(242,169,0,.8)}
.btn.danger{background:transparent}
@media (hover:hover){.btn:hover{background:var(--hover);transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(11,42,91,.35)}.btn.gold:hover{background:linear-gradient(180deg,#FFCB3D,#F5AE10)}.btn:active{transform:scale(.97)}}
.btn[disabled]{box-shadow:none;transform:none}
.k{border-radius:999px;padding:4px 12px}
.back{border-radius:999px;padding:6px 12px 6px 6px}

/* rows become tiles */
.row{border-bottom:1px solid var(--line);padding:14px 4px}
.card>.row:first-of-type{padding-top:0}
.row.pick{border-radius:12px;background:var(--tile)}
@media (hover:hover){.row.pick{transition:transform .15s var(--ease-out),box-shadow .15s ease}.row.pick:hover{transform:translateY(-1px);box-shadow:var(--sh1)}}

/* student identity card: the 3D one */
.who-card{gap:22px;padding:24px;transition:transform .2s var(--ease-out),box-shadow .2s ease;transform-style:preserve-3d;box-shadow:var(--sh2),inset 0 1px 0 rgba(255,255,255,.55)}

  // ------------------------------------------------------------- roll call
  async function viewRollcall() {

  // ---------------------------------------------------------------- verify
  function viewVerify() {
    const out = h('div', {});
    const code = h('input', { type: 'text', id: 'vc', placeholder: 'KCA-ABCD-EFGH-JKLM', autocapitalize: 'characters', autocomplete: 'off' });

    const call = async (fn) => { try { show(await fn()); } catch (ex) { out.replaceChildren(h('div', { class: 'err' }, ex.message)); } };
    const shellOrPlain = (...c) => S.user ? shell('verify', ...c) : h('div', {}, h('header', { class: 'top' }, h('div', { class: 'top-in' }, h('div', { class: 'brand' }, h('div', { class: 'logo' }, h('img', { src: window.KCA_LOGO, alt: 'KCA University' })), h('span', { class: 'bt' }, 'KCA University', h('small', {}, 'Exam e-Sign Sheet'))), h('nav', {}, h('a', { href: '#/login' }, 'Staff sign in')))), h('main', {}, ...c));

        h('h2', {}, 'Accessibility and data protection'),

  }
  async function render() { await renderInner(); const old = app.querySelector('.foot'); if (old) old.remove(); app.append(footer()); }
  async function renderInner() {
    clearTimers();
    const hash = location.hash || '#/';
    const [, route, a, b] = hash.split('/').map(decodeURIComponent);
    S.kiosk = ['sheet', 'student', 'form'].includes(route);
    if (route === 'form') S.unlock = 0;
    try {
      if (route === 'verify') return viewVerify();
      if (!S.user) return viewLogin();
      if (route === 'login') return go(home());
      switch (route) {
        case 'console': return await viewConsole();
        case 'sheet': return await viewSheet();
        case 'student': return await viewStudent(a);
        case 'form': return await viewForm(a, b);
        case 'records': return await viewRecords();
        case 'rollcall': return await viewRollcall();
        case 'director': return await viewDirector();
        case 'timetable': return await viewTimetable();
        default: return go(home());
      }
    } catch (ex) {
      if (ex.status === 401) return;
      app.replaceChildren(S.user ? shell('', h('div', { class: 'err' }, ex.message), h('button', { class: 'btn', onclick: () => go('#/console') }, 'Back to start')) : h('div', { class: 'err' }, ex.message));
    }
  }

  // Pointer-only depth on the identity card and sign-in card. Transform only, off for touch and for reduced motion.
  (() => {
    if (!window.matchMedia) return;
    const fine = matchMedia('(hover: hover) and (pointer: fine)'), calm = matchMedia('(prefers-reduced-motion: reduce)'); let on = null;
    document.addEventListener('pointermove', (e) => {
      if (!fine.matches || calm.matches) return;
      const t = e.target.closest ? e.target.closest('.who-card, .center .card') : null;
      if (on && on !== t) { on.style.transform = ''; on = null; }
      if (!t) return;
      if (e.target.closest('input, textarea, select, button, canvas')) { t.style.transform = ''; return; }
      on = t; const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      t.style.transform = `perspective(900px) rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 5).toFixed(2)}deg)`;

    document.addEventListener('pointerleave', () => { if (on) { on.style.transform = ''; on = null; } }, true);
  })();

  window.addEventListener('hashchange', render);

    try { S.cfg = await (await fetch('/api/config', { credentials: 'same-origin' })).json(); S.csrf = S.cfg.csrf; S.user = S.cfg.user; }
    catch { S.cfg = {}; }
    render();
  })();
})();
